<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Detalhes do Produto</title>
  <style>
    :root {
      --brand: #176b4d;
      --brand-dark: #0f4f3a;
      --brand-soft: #e4f3ec;
      --canvas: #f7f7f3;
      --surface: #ffffff;
      --ink: #17322a;
      --muted: #708078;
      --line: #dfe7e2;
      --shadow: 0 18px 60px rgba(19, 67, 52, 0.12);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--brand);
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button, a { font: inherit; }

    .page {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: calc(22px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(34px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--brand-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .product {
      display: grid;
      gap: 22px;
      margin-top: 24px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .image-wrap {
      display: grid;
      place-items: center;
      min-height: 300px;
      overflow: hidden;
      border-radius: 22px;
      background: linear-gradient(145deg, #edf7f2, #f9f4e7);
    }

    .image {
      display: block;
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .details { padding: 2px 4px 8px; }

    .market {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: .76rem;
      font-weight: 850;
      letter-spacing: .045em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 0;
      font-size: clamp(1.8rem, 8vw, 3.5rem);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .price {
      margin: 18px 0 0;
      color: var(--brand-dark);
      font-size: clamp(1.35rem, 6vw, 2rem);
      font-weight: 900;
    }

    .suggested {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .suggested-label {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .suggested-value {
      display: block;
      margin-top: 6px;
      font-size: clamp(2.15rem, 11vw, 4.6rem);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.055em;
    }

    .empty {
      margin-top: 24px;
      padding: 32px 22px;
      border: 1px dashed var(--line);
      border-radius: 24px;
      background: var(--surface);
      text-align: center;
    }

    .empty h1 { font-size: 1.7rem; }
    .empty p { color: var(--muted); line-height: 1.6; }

    [hidden] { display: none !important; }

    @media (min-width: 720px) {
      .page { padding-top: calc(48px + env(safe-area-inset-top)); }
      .product { grid-template-columns: minmax(0, 1fr) minmax(280px, .82fr); align-items: center; padding: 26px; }
      .image-wrap { min-height: 480px; }
      .details { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html" aria-label="Voltar para a lista de compras">← Voltar para a lista</a>

    <article class="product" id="product" hidden>
      <div class="image-wrap">
        <img class="image" id="productImage" alt="">
      </div>
      <div class="details">
        <span class="market" id="productMarket"></span>
        <h1 id="productName"></h1>
        <p class="price" id="productPrice"></p>
        <div class="suggested">
          <span class="suggested-label">Quantidade sugerida</span>
          <strong class="suggested-value" id="suggestedQuantity">A definir</strong>
        </div>
      </div>
    </article>

    <section class="empty" id="emptyState" hidden>
      <h1>Produto não encontrado</h1>
      <p>Volte para a lista e toque em um produto para abrir os detalhes.</p>
    </section>
  </main>

  <script>
    const storageKey = "lista-de-compras:produto-atual:v1";
    const productElement = document.querySelector("#product");
    const emptyState = document.querySelector("#emptyState");
    const imageElement = document.querySelector("#productImage");
    const marketElement = document.querySelector("#productMarket");
    const nameElement = document.querySelector("#productName");
    const priceElement = document.querySelector("#productPrice");
    const suggestedQuantityElement = document.querySelector("#suggestedQuantity");
    const currency = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

    const fallbackImage = name => {
      const initials = name.trim().split(/\s+/).slice(0, 2).map(word => word[0]).join("").toUpperCase() || "?";
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640"><rect width="640" height="640" rx="96" fill="#e4f3ec"/><circle cx="510" cy="122" r="108" fill="#f3be4b" opacity=".7"/><text x="320" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="176" font-weight="700" fill="#176b4d">${initials}</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    };

    function loadProduct() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "null");
      } catch {
        return null;
      }
    }

    const product = loadProduct();

    if (!product?.nome) {
      emptyState.hidden = false;
    } else {
      document.title = `${product.nome} · Lista de Compras`;
      imageElement.src = product.foto || fallbackImage(product.nome);
      imageElement.alt = product.nome;
      imageElement.addEventListener("error", () => {
        imageElement.src = fallbackImage(product.nome);
        imageElement.alt = `Imagem indisponível: ${product.nome}`;
      }, { once: true });
      nameElement.textContent = product.nome;
      priceElement.textContent = product.preco > 0 ? currency.format(product.preco) : "Preço não informado";
      suggestedQuantityElement.textContent = product.quantidadeSugerida || "A definir";

      if (!product.mercado || product.mercado === "N/A") {
        marketElement.hidden = true;
      } else {
        marketElement.textContent = product.mercado;
      }

      productElement.hidden = false;
    }
  </script>
</body>
</html>
