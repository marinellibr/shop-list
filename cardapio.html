<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cardápio GTA</title>
  <style>
    :root {
      --ink: #18352d;
      --muted: #6b7772;
      --surface: #fff;
      --canvas: #f7f7f3;
      --line: #dde3df;
      --brand: #176b4d;
      --brand-dark: #0d5038;
      --brand-soft: #e4f3ec;
      --accent: #f3be4b;
      --shadow: 0 18px 45px rgba(24, 53, 45, .1);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--canvas);
      color-scheme: light;
      touch-action: pan-y;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 90% 0%, rgba(243, 190, 75, .18), transparent 26rem),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 10;
      top: 0;
      right: 0;
      left: 0;
      height: env(safe-area-inset-top);
      background: var(--canvas);
      pointer-events: none;
    }

    .app {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      color: var(--brand-dark);
      font-size: .8rem;
      font-weight: 800;
      text-decoration: none;
    }

    header { margin: 28px 0 34px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--brand);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 13vw, 5.5rem);
      line-height: .94;
      letter-spacing: -.06em;
    }

    .subtitle {
      max-width: 620px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .sections {
      display: grid;
      gap: 22px;
    }

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .9);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -.025em;
    }

    .panel-tag {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-size: .72rem;
      font-weight: 800;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 180px;
      padding: 28px;
      border: 1px dashed #cbd6d0;
      border-radius: 18px;
      background: #fafbf9;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: var(--brand-soft);
      font-size: 1.5rem;
    }

    .empty-state strong { display: block; margin-bottom: 6px; }
    .empty-state p { max-width: 35ch; margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }

    .calendar-nav {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 46px;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .calendar-arrow {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      color: var(--brand-dark);
      cursor: pointer;
      font-size: 1.35rem;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
    }

    .calendar-arrow:hover:not(:disabled) { background: var(--brand-soft); transform: translateY(-1px); }
    .calendar-arrow:disabled { cursor: default; opacity: .3; }

    .current-date { min-width: 0; text-align: center; }
    .current-date strong { display: block; font-size: clamp(1.35rem, 6vw, 2rem); letter-spacing: -.04em; }
    .current-date span { display: block; margin-top: 2px; color: var(--muted); font-size: .82rem; font-weight: 700; }

    .date-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(48px, 1fr));
      gap: 7px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .date-strip::-webkit-scrollbar { display: none; }

    .date-chip {
      min-width: 48px;
      padding: 9px 5px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fafbf9;
      color: var(--muted);
      cursor: pointer;
      font-size: .72rem;
      font-weight: 800;
      text-align: center;
    }

    .date-chip span { display: block; margin-top: 2px; color: var(--ink); font-size: .9rem; }
    .date-chip.active { border-color: var(--brand); background: var(--brand); color: #d7ebe3; }
    .date-chip.active span { color: #fff; }

    .day-content {
      min-height: 210px;
      padding: 6px 0 0;
    }

    .day-content .empty-state { min-height: 204px; }

    .recipe-list { display: grid; gap: 12px; }

    .recipe-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fafbf9;
    }

    .recipe-card.has-image {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }

    .recipe-image {
      display: block;
      width: 92px;
      height: 76px;
      border-radius: 13px;
      object-fit: cover;
      background: var(--brand-soft);
    }

    .recipe-card h3 { margin: 0; font-size: 1rem; }
    .recipe-card p { margin: 7px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }

    .recipe-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-size: .68rem;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .anytime-grid {
      display: grid;
      gap: 10px;
    }

    .anytime-recipe {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fafbf9;
      font-size: .92rem;
      font-weight: 750;
    }

    .anytime-recipe::before {
      content: "";
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(243, 190, 75, .18);
    }

    .anytime-recipe.has-image::before { display: none; }

    .anytime-image {
      flex: 0 0 auto;
      width: 58px;
      height: 52px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--brand-soft);
    }

    @media (min-width: 760px) {
      .app { padding: calc(54px + env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left)); }
      header { margin: 42px 0 48px; }
      .panel { padding: 26px; }
      .calendar-nav { grid-template-columns: 52px minmax(0, 1fr) 52px; }
      .calendar-arrow { width: 52px; height: 52px; }
      .anytime-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app">
    <a class="back-link" href="index.html">← Lista de compras</a>

    <header>
      <p class="eyebrow">Roteiro gastronômico</p>
      <h1>Cardápio.</h1>
      <p class="subtitle">Aqui vamos organizar os pratos por data e manter ideias de receitas que podem ser preparadas a qualquer momento.</p>
    </header>

    <div class="sections">
      <section class="panel" aria-labelledby="scheduledTitle">
        <div class="panel-heading">
          <h2 id="scheduledTitle">Calendário</h2>
          <span class="panel-tag">17/11 — 22/11</span>
        </div>

        <div class="calendar-nav">
          <button class="calendar-arrow" id="previousDay" type="button" aria-label="Dia anterior">←</button>
          <div class="current-date" aria-live="polite">
            <strong id="currentDate">17 de novembro</strong>
            <span id="currentWeekday">Terça-feira</span>
          </div>
          <button class="calendar-arrow" id="nextDay" type="button" aria-label="Próximo dia">→</button>
        </div>

        <nav class="date-strip" id="dateStrip" aria-label="Escolher data"></nav>
        <div class="day-content" id="dayContent"></div>
      </section>

      <section class="panel" aria-labelledby="anytimeTitle">
        <div class="panel-heading">
          <h2 id="anytimeTitle">Para qualquer momento</h2>
          <span class="panel-tag" id="anytimeCount">Sem data</span>
        </div>
        <div id="anytimeContent"></div>
      </section>
    </div>
  </main>

  <script>
    ["gesturestart", "gesturechange", "gestureend"].forEach(eventName => {
      document.addEventListener(eventName, event => event.preventDefault(), { passive: false });
    });

    document.addEventListener("touchmove", event => {
      if (event.touches.length > 1) event.preventDefault();
    }, { passive: false });

    const calendario = [
      {
        data: "17/11",
        dia: "Ter",
        titulo: "17 de novembro",
        semana: "Terça-feira",
        pratos: [
          { momento: "Almoço", nome: "PF de Picanha com Farofa de Ovo", foto: "https://images.unsplash.com/photo-1702288824213-58b8b47732b0?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta", nome: "Strogonoff de Camarão", foto: "https://images.unsplash.com/photo-1551248429-40975aa4de74?auto=format&fit=crop&w=800&q=82" }
        ]
      },
      {
        data: "18/11",
        dia: "Qua",
        titulo: "18 de novembro",
        semana: "Quarta-feira",
        pratos: [
          { momento: "Almoço", nome: "Swedish Meatball Sandwich", foto: "https://images.unsplash.com/photo-1745031601345-30fb3f97b118?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Nuggets", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Batata Frita", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Fried Calamari", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Pão de Alho", foto: "https://samsclub.vtexassets.com/arquivos/ids/219413-848-848/7898337980248%20Pao%20De%20Alho%20Trad%20Baguete%20300g%20Zinho.jpg?v=639003853807570000" },
          { momento: "Janta · Boteco", nome: "Salgados com Massa de Pizza", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Mandioca Frita", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Polenta Frita", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Calabresa Acebolada", foto: "https://images.unsplash.com/photo-1702288824213-58b8b47732b0?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta · Boteco", nome: "Bife Acebolado", foto: "https://images.unsplash.com/photo-1702288824213-58b8b47732b0?auto=format&fit=crop&w=800&q=82" }
        ]
      },
      {
        data: "19/11",
        dia: "Qui",
        titulo: "19 de novembro",
        semana: "Quinta-feira",
        pratos: [
          { momento: "Almoço", nome: "Lasanha", foto: "https://images.unsplash.com/photo-1709429790175-b02bb1b19207?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta", nome: "Lasanha", foto: "https://images.unsplash.com/photo-1709429790175-b02bb1b19207?auto=format&fit=crop&w=800&q=82" }
        ]
      },
      {
        data: "20/11",
        dia: "Sex",
        titulo: "20 de novembro",
        semana: "Sexta-feira",
        pratos: [
          { momento: "Dia todo", nome: "Churrasco com Arroz, Feijão, Farofa e Maionese", foto: "https://images.unsplash.com/photo-1702288824213-58b8b47732b0?auto=format&fit=crop&w=800&q=82" }
        ]
      },
      {
        data: "21/11",
        dia: "Sáb",
        titulo: "21 de novembro",
        semana: "Sábado",
        pratos: [
          { momento: "Almoço", nome: "Strogonoff de Carne", foto: "https://images.unsplash.com/photo-1745031601345-30fb3f97b118?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta", nome: "Hot Dog", foto: "https://images.unsplash.com/photo-1768250708131-23da8d1cb5ad?auto=format&fit=crop&w=800&q=82" },
          { momento: "Janta", nome: "Carne Louca", foto: "https://images.unsplash.com/photo-1702288824213-58b8b47732b0?auto=format&fit=crop&w=800&q=82" }
        ]
      },
      { data: "22/11", dia: "Dom", titulo: "22 de novembro", semana: "Domingo", pratos: [] }
    ];

    const receitasLivres = [
      { nome: "Brownie", foto: "https://images.unsplash.com/photo-1777647362214-ae62d7d4a707?auto=format&fit=crop&w=800&q=82" },
      { nome: "Cocada de Forno", foto: "https://images.unsplash.com/photo-1535922964111-cf1f1e862dcc?auto=format&fit=crop&w=800&q=82" },
      { nome: "Long Island Jager Sprite", foto: "https://images.unsplash.com/photo-1576670394248-c041349f33fe?auto=format&fit=crop&w=800&q=82" },
      { nome: "Ceviche de Manga", foto: "https://obahortifruti.vtexassets.com/arquivos/ids/11475765/Manga-Rosa-Kg.jpg?v=638937381437930000" },
      { nome: "Bolinho Porco Espinho com Camarão", foto: "https://images.unsplash.com/photo-1762631885089-87c72596dd70?auto=format&fit=crop&w=800&q=82" },
      { nome: "Lobster Roll", foto: "https://images.unsplash.com/photo-1761682719764-b49608326fe9?auto=format&fit=crop&w=800&q=82" },
      { nome: "Cheong de Hortelã", foto: "https://obahortifruti.vtexassets.com/arquivos/ids/11474300/Hortela-Hidroponica-Unidade.jpg?v=638863696781830000" },
      { nome: "Cheong de Frutas Vermelhas", foto: "https://swiftbr.vteximg.com.br/arquivos/ids/208715/617907-mix-de-frutas-vermelhas_inn.jpg?v=638870702332670000" },
      { nome: "Salada de Batata", foto: "https://samsclub.vtexassets.com/arquivos/ids/164097-848-848/batatabolinhababysuperbatatapacote1kg7898940128037.jpg?v=637575534513670000" },
      { nome: "Maionese de Ovo", foto: "https://images.unsplash.com/photo-1635843086739-624d71f440b3?auto=format&fit=crop&w=800&q=82" },
      { nome: "Tábua de Charcuteria", foto: "https://images.unsplash.com/photo-1773418528879-1270556999e5?auto=format&fit=crop&w=800&q=82" },
            {
        nome: "Margarita de Morango",
        foto: "https://images.unsplash.com/photo-1777394719220-5e228222d85b?auto=format&fit=crop&w=800&q=82"
      },
      {
        nome: "Margarita de Frutas Vermelhas",
        foto: "https://images.unsplash.com/photo-1516684163977-84cc7de8c7c8?auto=format&fit=crop&w=800&q=82"
      },
      {
        nome: "Tempurá de Camarão",
        foto: "https://images.unsplash.com/photo-1750308250159-eabb42417e0c?auto=format&fit=crop&w=800&q=82"
      },
      {
        nome: "Tempurá de Legumes",
        foto: "https://images.unsplash.com/photo-1570078362689-c57c33cca104?auto=format&fit=crop&w=800&q=82"
      },
    ];
    let activeDay = 0;

    const previousButton = document.querySelector("#previousDay");
    const nextButton = document.querySelector("#nextDay");
    const currentDate = document.querySelector("#currentDate");
    const currentWeekday = document.querySelector("#currentWeekday");
    const dateStrip = document.querySelector("#dateStrip");
    const dayContent = document.querySelector("#dayContent");
    const anytimeContent = document.querySelector("#anytimeContent");
    const anytimeCount = document.querySelector("#anytimeCount");

    function renderDateStrip() {
      dateStrip.replaceChildren();
      calendario.forEach((entry, index) => {
        const button = document.createElement("button");
        button.className = `date-chip${index === activeDay ? " active" : ""}`;
        button.type = "button";
        button.innerHTML = `${entry.dia}<span>${entry.data.slice(0, 2)}</span>`;
        button.setAttribute("aria-label", entry.titulo);
        button.setAttribute("aria-current", index === activeDay ? "date" : "false");
        button.addEventListener("click", () => {
          activeDay = index;
          renderCalendar();
        });
        dateStrip.append(button);
      });
    }

    function renderDayContent(entry) {
      dayContent.replaceChildren();

      if (!entry.pratos.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `<div><span class="empty-icon" aria-hidden="true">📅</span><strong>Nenhum prato previsto</strong><p>Os pratos planejados para ${entry.data} aparecerão aqui.</p></div>`;
        dayContent.append(empty);
        return;
      }

      const list = document.createElement("div");
      list.className = "recipe-list";
      entry.pratos.forEach(prato => {
        const card = document.createElement("article");
        card.className = "recipe-card";
        const details = document.createElement("div");
        details.innerHTML = `<div class="recipe-card-header"><span class="meal-badge">${prato.momento}</span><h3>${prato.nome}</h3></div>${prato.descricao ? `<p>${prato.descricao}</p>` : ""}`;

        if (prato.foto) {
          const image = document.createElement("img");
          image.className = "recipe-image";
          image.src = prato.foto;
          image.alt = `Foto ilustrativa de ${prato.nome}`;
          image.loading = "lazy";
          image.addEventListener("error", () => {
            image.remove();
            card.classList.remove("has-image");
          }, { once: true });
          card.classList.add("has-image");
          card.append(image);
        }

        card.append(details);
        list.append(card);
      });
      dayContent.append(list);
    }

    function renderAnytimeRecipes() {
      anytimeCount.textContent = `${receitasLivres.length} receitas`;

      if (!receitasLivres.length) {
        anytimeContent.className = "empty-state";
        anytimeContent.innerHTML = '<div><span class="empty-icon" aria-hidden="true">🍽️</span><strong>Nenhuma receita adicionada</strong><p>As receitas livres ficarão disponíveis aqui para escolher quando quiser.</p></div>';
        return;
      }

      anytimeContent.className = "anytime-grid";
      anytimeContent.replaceChildren();
      receitasLivres.forEach(receita => {
        const item = document.createElement("article");
        item.className = "anytime-recipe";

        if (receita.foto) {
          const image = document.createElement("img");
          image.className = "anytime-image";
          image.src = receita.foto;
          image.alt = `Foto ilustrativa de ${receita.nome}`;
          image.loading = "lazy";
          image.addEventListener("error", () => {
            image.remove();
            item.classList.remove("has-image");
          }, { once: true });
          item.classList.add("has-image");
          item.append(image);
        }

        const name = document.createElement("span");
        name.textContent = receita.nome;
        item.append(name);
        anytimeContent.append(item);
      });
    }

    function renderCalendar() {
      const entry = calendario[activeDay];
      currentDate.textContent = entry.titulo;
      currentWeekday.textContent = entry.semana;
      previousButton.disabled = activeDay === 0;
      nextButton.disabled = activeDay === calendario.length - 1;
      renderDateStrip();
      renderDayContent(entry);
    }

    previousButton.addEventListener("click", () => {
      if (activeDay > 0) {
        activeDay -= 1;
        renderCalendar();
      }
    });

    nextButton.addEventListener("click", () => {
      if (activeDay < calendario.length - 1) {
        activeDay += 1;
        renderCalendar();
      }
    });

    renderCalendar();
    renderAnytimeRecipes();
  </script>
</body>
</html>
