<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Lista de Compras GTA</title>
  <style>
    :root {
      --ink: #18352d;
      --muted: #6b7772;
      --surface: #ffffff;
      --canvas: #f7f7f3;
      --line: #dde3df;
      --brand: #176b4d;
      --brand-dark: #0d5038;
      --footer-green: #114132;
      --brand-soft: #e4f3ec;
      --accent: #f3be4b;
      --shadow: 0 18px 45px rgba(24, 53, 45, 0.1);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: linear-gradient(to bottom, var(--canvas) 0 50%, var(--footer-green) 50% 100%);
      color-scheme: light;
      touch-action: pan-y;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 90% 0%, rgba(243, 190, 75, 0.18), transparent 26rem),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 12;
      right: 0;
      left: 0;
      pointer-events: none;
    }

    body::before {
      top: 0;
      height: env(safe-area-inset-top);
      background: var(--canvas);
    }

    body::after {
      bottom: 0;
      height: env(safe-area-inset-bottom);
      background: var(--footer-green);
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(190px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 9px;
      color: var(--brand);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 13ch;
      font-size: clamp(2rem, 9vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .count-badge {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      min-width: 54px;
      height: 54px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--brand);
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(24, 53, 45, 0.06);
    }

    .header-actions {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
    }

    .purchased-view-button,
    .menu-page-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--brand-dark);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
      text-decoration: none;
    }

    .menu-page-button {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
      box-shadow: 0 8px 22px rgba(23, 107, 77, 0.18);
    }

    .menu-page-button:hover { background: var(--brand-dark); }

    .purchased-view-button.active { border-color: var(--brand); background: var(--brand); color: #fff; }

    .purchased-count {
      display: grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-size: 0.72rem;
    }

    .purchased-view-button.active .purchased-count { background: rgba(255, 255, 255, 0.18); color: #fff; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .toolbar-label {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    .toolbar-actions { display: flex; align-items: center; gap: 7px; }

    .select-all-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 800;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .select-all-button:hover { transform: translateY(-1px); }
    .select-all-button:disabled { cursor: default; opacity: 0.45; transform: none; }

    .clear-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 800;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .clear-button:hover { transform: translateY(-1px); }
    .clear-button:disabled { cursor: default; opacity: 0.45; transform: none; }

    .market-filters {
      display: flex;
      gap: 8px;
      margin: 0 -16px 18px;
      padding: 2px 16px 6px;
      overflow-x: auto;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .market-filters::-webkit-scrollbar { display: none; }

    .filter-pill {
      flex: 0 0 auto;
      appearance: none;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 750;
      scroll-snap-align: start;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .filter-pill:hover { transform: translateY(-1px); border-color: #91aa9f; }

    .filter-pill.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
      box-shadow: 0 7px 18px rgba(23, 107, 77, 0.2);
    }

    .shopping-list {
      display: grid;
      gap: 28px;
    }

    .category-section {
      display: grid;
      gap: 11px;
    }

    .category-heading {
      padding: 0 2px;
    }

    .category-title {
      margin: 0;
      width: 100%;
    }

    .category-toggle {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 46px;
      padding: 8px 10px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      font-size: .96rem;
      font-weight: 800;
      letter-spacing: -.015em;
      text-align: left;
      cursor: pointer;
    }

    .category-toggle:hover { background: rgba(23, 107, 77, 0.055); }
    .category-toggle:focus-visible { outline: 3px solid rgba(23, 107, 77, 0.2); outline-offset: 2px; }

    .category-icon { font-size: 1.08rem; }

    .category-count {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: .7rem;
      font-weight: 850;
    }

    .category-chevron {
      color: var(--brand);
      font-size: 1.05rem;
      transition: transform 180ms ease;
    }

    .category-toggle[aria-expanded="false"] .category-chevron { transform: rotate(-90deg); }

    .category-items {
      display: grid;
      gap: 12px;
    }

    .category-items[hidden] { display: none; }

    .item {
      position: relative;
      display: grid;
      grid-template-columns: 28px 68px minmax(0, 1fr);
      grid-template-rows: auto auto;
      gap: 8px 10px;
      align-items: center;
      min-height: 108px;
      padding: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(24, 53, 45, 0.055);
      cursor: pointer;
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease, background 180ms ease;
    }

    .item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .item:focus-visible { outline: 3px solid rgba(23, 107, 77, 0.28); outline-offset: 3px; }
    .item.selected { border-color: #7dbb9f; background: linear-gradient(135deg, #fff, #f0f8f4); }
    .item.purchased {
      border-color: #d8dedb;
      background: #f0f2f0;
      box-shadow: none;
      cursor: pointer;
      opacity: 0.68;
    }
    .item.purchased:hover { transform: none; box-shadow: none; }
    .item.purchased .product-image { filter: grayscale(0.55); }
    .item:focus-within { outline: 3px solid rgba(23, 107, 77, 0.17); outline-offset: 2px; }

    .product-image {
      grid-column: 2;
      grid-row: 1 / 3;
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 16px;
      background: var(--brand-soft);
    }

    .product-info { grid-column: 3; grid-row: 1; min-width: 0; }

    .market {
      display: inline-block;
      max-width: 100%;
      margin-bottom: 5px;
      overflow: hidden;
      color: var(--brand);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.055em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .product-name {
      margin: 0;
      overflow: hidden;
      font-size: 1.02rem;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .quantity-control {
      grid-column: 3;
      grid-row: 2;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--canvas);
    }

    .quantity-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--brand-dark);
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .quantity-button:hover { background: var(--brand-soft); }
    .quantity-button:disabled { cursor: default; opacity: 0.3; background: transparent; }

    .quantity-value {
      min-width: 30px;
      color: var(--ink);
      font-weight: 850;
      text-align: center;
    }

    .price-stack { text-align: left; }
    .product-price { display: block; color: var(--ink); font-weight: 850; }
    .unit-price { display: block; margin-top: 1px; font-size: 0.69rem; }

    .return-button {
      grid-column: 3;
      grid-row: 2;
      justify-self: end;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #b9c8c1;
      border-radius: 10px;
      background: #fff;
      color: var(--brand-dark);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .return-button:hover { border-color: var(--brand); background: var(--brand-soft); }

    .checkbox {
      grid-column: 1;
      grid-row: 1 / 3;
      appearance: none;
      width: 26px;
      height: 26px;
      margin: 0;
      border: 2px solid #abb8b2;
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .checkbox:checked {
      border-color: var(--brand);
      background: var(--brand);
    }

    .checkbox:checked::after {
      content: "";
      display: block;
      width: 9px;
      height: 5px;
      margin: 7px 0 0 6px;
      border: solid white;
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg);
    }

    .sticky-total {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      border-top: 1px solid rgba(255,255,255,.13);
      background: var(--footer-green);
      color: #fff;
      box-shadow: 0 -16px 36px rgba(24, 53, 45, 0.18);
      backdrop-filter: blur(16px);
    }

    .sticky-total.hidden { display: none; }

    .total-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px 18px;
      width: min(1088px, 100%);
      margin: 0 auto;
    }

    .total-label { display: block; color: #c7dbd3; font-size: 0.76rem; font-weight: 700; }
    .selected-summary { margin-top: 3px; font-size: 0.9rem; font-weight: 650; }
    .total-value { color: #fff4d1; font-size: clamp(1.45rem, 7vw, 2rem); font-weight: 850; letter-spacing: -0.045em; white-space: nowrap; }

    .checkout-button {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #263a32;
      cursor: pointer;
      font-weight: 850;
      transition: filter 160ms ease, transform 160ms ease, opacity 160ms ease;
    }

    .checkout-button:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .checkout-button:disabled { cursor: default; opacity: 0.42; filter: grayscale(0.35); transform: none; }

    .empty {
      padding: 40px 24px;
      border: 1px dashed #b7c2bd;
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    @media (min-width: 700px) {
      .app { padding: calc(54px + env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) calc(142px + env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left)); }
      header { align-items: flex-end; margin-bottom: 42px; }
      .market-filters { margin-right: 0; margin-left: 0; padding-right: 0; padding-left: 0; }
      .category-items { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .item { grid-template-columns: 30px 92px minmax(0, 1fr) auto; grid-template-rows: auto; min-height: 128px; padding: 17px; }
      .checkbox { grid-column: 1; grid-row: 1; }
      .product-image { grid-column: 2; grid-row: 1; width: 92px; height: 92px; }
      .product-info { grid-column: 3; grid-row: 1; }
      .item > .quantity-control { grid-column: 4; grid-row: 1; }
      .item > .return-button { grid-column: 4; grid-row: 1; }
      .sticky-total { padding-top: 17px; padding-bottom: calc(17px + env(safe-area-inset-bottom)); }
      .total-inner { grid-template-columns: minmax(0, 1fr) auto auto; }
      .checkout-button { grid-column: auto; width: auto; min-width: 190px; padding: 0 22px; }
    }

    @media (max-width: 480px) {
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-actions { width: 100%; }
      .toolbar-actions button { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow"><span aria-hidden="true">●</span> Lista da semana</p>
        <h1>Compras GTA.</h1>
        <p class="subtitle">Marque no círculo ou toque no card para ver os detalhes.</p>
      </div>
      <div class="header-actions">
        <a class="menu-page-button" href="cardapio.html">Cardápio</a>
        <button class="purchased-view-button" id="purchasedViewButton" type="button">
          <span id="purchasedViewLabel">Comprados</span>
          <span class="purchased-count" id="purchasedCount">0</span>
        </button>
        <div class="count-badge" id="itemCount" aria-label="Quantidade de itens">0</div>
      </div>
    </header>

    <section aria-labelledby="listTitle">
      <div class="toolbar">
        <span class="toolbar-label" id="listTitle">Seus itens</span>
        <div class="toolbar-actions">
          <button class="select-all-button" id="selectAllButton" type="button">Selecionar todos</button>
          <button class="clear-button" id="clearSelection" type="button" disabled>Limpar seleção</button>
        </div>
      </div>
      <nav class="market-filters" id="marketFilters" aria-label="Filtrar por mercado"></nav>
      <div class="shopping-list" id="shoppingList"></div>
    </section>
  </main>

  <footer class="sticky-total" aria-live="polite">
    <div class="total-inner">
      <div>
        <span class="total-label">Total selecionado</span>
        <div class="selected-summary" id="selectedSummary">Nenhum item</div>
      </div>
      <div class="total-value" id="totalValue">R$ 0,00</div>
      <button class="checkout-button" id="checkoutButton" type="button" disabled>Finalizar compra</button>
    </div>
  </footer>

    const normalizeProductName = value => value
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();

    function getProductCategory(product) {
      if (product.categoria) return product.categoria;
      const normalizedName = normalizeProductName(product.nome);
      return categoryDefinitions.find(category =>
        category.terms.some(term => normalizedName.includes(term))
      )?.name || "Outros";
    }

    const listElement = document.querySelector("#shoppingList");

    const selectedItems = new Set();
    const storageKey = "lista-de-compras:itens-finalizados:v1";
    const quantityStorageKey = "lista-de-compras:quantidades:v1";
    const detailStorageKey = "lista-de-compras:produto-atual:v1";
    const collapsedCategoryStorageKey = "lista-de-compras:categorias-recolhidas:v1";
    const productKey = product => `${product.mercado}::${product.nome}`;

    function loadSavedQuantities() {
      try {
        const saved = JSON.parse(localStorage.getItem(quantityStorageKey) || "{}");
        produtos.forEach(product => {
          const quantity = Number(saved[productKey(product)]);
          if (Number.isInteger(quantity) && quantity >= 1 && quantity <= 99) {
            product.quantidade = quantity;
          }
        });
      } catch {
        /* Mantém as quantidades do array se o armazenamento não estiver disponível. */
      }
    }

    function saveQuantities() {
      try {
        const quantities = Object.fromEntries(
          produtos.map(product => [productKey(product), product.quantidade])
        );
        localStorage.setItem(quantityStorageKey, JSON.stringify(quantities));
      } catch {
        /* A lista continua funcionando mesmo se o navegador bloquear o armazenamento. */
      }
    }

    function loadPurchasedItems() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function savePurchasedItems() {
      try {
        localStorage.setItem(storageKey, JSON.stringify([...purchasedItems]));
      } catch {
        /* A lista continua funcionando mesmo se o navegador bloquear o armazenamento. */
      }
    }

    function loadCollapsedCategories() {
      try {
        const saved = JSON.parse(localStorage.getItem(collapsedCategoryStorageKey) || "[]");
        return new Set(Array.isArray(saved) ? saved : []);
      } catch {
        return new Set();
      }
    }

    function saveCollapsedCategories() {
      try {
        localStorage.setItem(collapsedCategoryStorageKey, JSON.stringify([...collapsedCategories]));
      } catch {
        /* O accordion continua funcionando durante a sessão. */
      }
    }

    loadSavedQuantities();
    const purchasedItems = loadPurchasedItems();
    const collapsedCategories = loadCollapsedCategories();
    let activeMarket = "Todos";
    let currentView = "shopping";

    const currency = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    const fallbackImage = (name) => {
      const initials = name.trim().split(/\s+/).slice(0, 2).map(word => word[0]).join("").toUpperCase() || "?";
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><rect width="240" height="240" rx="42" fill="#e4f3ec"/><circle cx="190" cy="48" r="44" fill="#f3be4b" opacity=".7"/><text x="120" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#176b4d">${initials}</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    };

    function updateTotal() {
      const total = produtos.reduce((sum, product, index) => {
        return selectedItems.has(index) ? sum + product.preco * product.quantidade : sum;
      }, 0);

      const count = selectedItems.size;
      selectedSummaryElement.textContent = count === 0 ? "Nenhum item" : `${count} ${count === 1 ? "item" : "itens"}`;
      totalValueElement.textContent = currency.format(total);
      clearButton.disabled = count === 0;
      checkoutButton.disabled = count === 0;
      updateSelectAllButton();
    }

    function getSelectableIndexes() {
      return produtos
        .map((product, index) => ({ product, index }))
        .filter(({ product }) => !purchasedItems.has(productKey(product)))
        .filter(({ product }) => activeMarket === "Todos" || product.mercado === activeMarket)
        .map(({ index }) => index);
    }

    function updateSelectAllButton() {
      const selectableIndexes = getSelectableIndexes();
      const allSelected = selectableIndexes.length > 0 && selectableIndexes.every(index => selectedItems.has(index));
      selectAllButton.textContent = allSelected ? "Todos selecionados" : "Selecionar todos";
      selectAllButton.disabled = currentView === "purchased" || selectableIndexes.length === 0 || allSelected;
    }

    function updateViewControls() {
      const purchasedCount = produtos.filter(product => purchasedItems.has(productKey(product))).length;
      const viewingPurchased = currentView === "purchased";
      purchasedCountElement.textContent = purchasedCount;
      purchasedViewLabel.textContent = viewingPurchased ? "Voltar à lista" : "Comprados";
      purchasedViewButton.classList.toggle("active", viewingPurchased);
      purchasedViewButton.setAttribute("aria-pressed", String(viewingPurchased));
      listTitleElement.textContent = viewingPurchased ? "Itens comprados" : "Seus itens";
      footerElement.classList.toggle("hidden", viewingPurchased);
      selectAllButton.hidden = viewingPurchased;
      clearButton.hidden = viewingPurchased;
      updateSelectAllButton();
    }

    function renderFilters() {
      filtersElement.replaceChildren();

      mercados.forEach(marketName => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `filter-pill${activeMarket === marketName ? " active" : ""}`;
        button.textContent = marketName;
        button.setAttribute("aria-pressed", String(activeMarket === marketName));
        button.addEventListener("click", () => {
          activeMarket = marketName;
          renderFilters();
          renderList();
          updateSelectAllButton();
        });
        filtersElement.append(button);
      });
    }

    function renderList() {
      const visibleProducts = produtos
        .map((product, index) => ({ product, index }))
        .filter(({ product }) => {
          const isPurchased = purchasedItems.has(productKey(product));
          const belongsToView = currentView === "purchased" ? isPurchased : !isPurchased;
          const belongsToMarket = activeMarket === "Todos" || product.mercado === activeMarket;
          return belongsToView && belongsToMarket;
        });

      itemCountElement.textContent = visibleProducts.length;
      itemCountElement.setAttribute("aria-label", `${visibleProducts.length} itens visíveis`);
      listElement.replaceChildren();

      if (!visibleProducts.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = currentView === "purchased"
          ? "Nenhum item comprado neste mercado."
          : `Nenhum item pendente${activeMarket === "Todos" ? "" : ` em ${activeMarket}`}.`;
        listElement.append(empty);
        return;
      }

      const groupedProducts = new Map();
      visibleProducts.forEach(entry => {
        const categoryName = getProductCategory(entry.product);
        if (!groupedProducts.has(categoryName)) groupedProducts.set(categoryName, []);
        groupedProducts.get(categoryName).push(entry);
      });

      categoryDefinitions.forEach((category, categoryIndex) => {
        const categoryProducts = groupedProducts.get(category.name);
        if (!categoryProducts?.length) return;

        const section = document.createElement("section");
        section.className = "category-section";
        const heading = document.createElement("div");
        heading.className = "category-heading";
        const title = document.createElement("h3");
        title.className = "category-title";
        const toggle = document.createElement("button");
        toggle.className = "category-toggle";
        toggle.type = "button";
        toggle.id = `category-${categoryIndex}`;
        const icon = document.createElement("span");
        icon.className = "category-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = category.icon;
        const titleText = document.createElement("span");
        titleText.className = "category-label";
        titleText.textContent = category.name;
        const count = document.createElement("span");
        count.className = "category-count";
        count.textContent = `${categoryProducts.length} ${categoryProducts.length === 1 ? "item" : "itens"}`;
        const chevron = document.createElement("span");
        chevron.className = "category-chevron";
        chevron.setAttribute("aria-hidden", "true");
        chevron.textContent = "▾";
        toggle.append(icon, titleText, count, chevron);
        title.append(toggle);
        heading.append(title);
        section.setAttribute("aria-labelledby", toggle.id);

        const categoryItems = document.createElement("div");
        categoryItems.className = "category-items";
        categoryItems.id = `category-panel-${categoryIndex}`;
        const isCollapsed = collapsedCategories.has(category.name);
        categoryItems.hidden = isCollapsed;
        toggle.setAttribute("aria-controls", categoryItems.id);
        toggle.setAttribute("aria-expanded", String(!isCollapsed));
        toggle.addEventListener("click", () => {
          const shouldCollapse = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!shouldCollapse));
          categoryItems.hidden = shouldCollapse;
          shouldCollapse ? collapsedCategories.add(category.name) : collapsedCategories.delete(category.name);
          saveCollapsedCategories();
        });

        categoryProducts.forEach(({ product, index }) => {
        const isPurchased = purchasedItems.has(productKey(product));
        const card = document.createElement("article");
        card.className = `item${selectedItems.has(index) ? " selected" : ""}${isPurchased ? " purchased" : ""}`;
        card.tabIndex = 0;
        card.setAttribute("role", "link");
        card.setAttribute("aria-label", `Abrir detalhes de ${product.nome}`);

        const image = document.createElement("img");
        image.className = "product-image";
        image.src = product.foto || fallbackImage(product.nome);
        image.alt = product.foto ? product.nome : `Imagem ilustrativa de ${product.nome}`;
        image.loading = "lazy";
        image.addEventListener("error", () => {
          image.src = fallbackImage(product.nome);
          image.alt = `Imagem indisponível: ${product.nome}`;
        }, { once: true });

        const info = document.createElement("div");
        info.className = "product-info";

        const market = document.createElement("span");
        market.className = "market";
        market.textContent = product.mercado === "N/A" ? "Sem mercado" : product.mercado;

        const name = document.createElement("h2");
        name.className = "product-name";
        name.textContent = product.nome;

        const meta = document.createElement("div");
        meta.className = "product-meta";

        const quantityControl = document.createElement("div");
        quantityControl.className = "quantity-control";

        const minusButton = document.createElement("button");
        minusButton.className = "quantity-button";
        minusButton.type = "button";
        minusButton.textContent = "−";
        minusButton.setAttribute("aria-label", `Diminuir quantidade de ${product.nome}`);

        const quantity = document.createElement("span");
        quantity.className = "quantity-value";
        quantity.setAttribute("aria-live", "polite");

        const plusButton = document.createElement("button");
        plusButton.className = "quantity-button";
        plusButton.type = "button";
        plusButton.textContent = "+";
        plusButton.setAttribute("aria-label", `Aumentar quantidade de ${product.nome}`);

        quantityControl.append(minusButton, quantity, plusButton);

        const priceStack = document.createElement("div");
        priceStack.className = "price-stack";
        const price = document.createElement("span");
        price.className = "product-price";
        const unitPrice = document.createElement("span");
        unitPrice.className = "unit-price";
        unitPrice.textContent = product.preco > 0 ? `${currency.format(product.preco)} cada` : "Preço não informado";
        priceStack.append(price, unitPrice);
        meta.append(priceStack);
        info.append(market, name, meta);

        const checkbox = document.createElement("input");
        checkbox.className = "checkbox";
        checkbox.type = "checkbox";
        checkbox.checked = isPurchased || selectedItems.has(index);
        checkbox.disabled = isPurchased;
        checkbox.setAttribute("aria-label", isPurchased ? `${product.nome} já comprado` : `Selecionar ${product.nome}`);
        checkbox.addEventListener("change", () => {
          checkbox.checked ? selectedItems.add(index) : selectedItems.delete(index);
          card.classList.toggle("selected", checkbox.checked);
          updateTotal();
        });

        const returnButton = document.createElement("button");
        returnButton.className = "return-button";
        returnButton.type = "button";
        returnButton.textContent = "Retornar à lista";
        returnButton.setAttribute("aria-label", `Retornar ${product.nome} à lista principal`);
        returnButton.addEventListener("click", event => {
          event.stopPropagation();
          purchasedItems.delete(productKey(product));
          savePurchasedItems();
          renderList();
          updateViewControls();
        });

        function refreshQuantity() {
          quantity.textContent = product.quantidade;
          price.textContent = product.preco > 0 ? currency.format(product.preco * product.quantidade) : "Sem preço";
          minusButton.disabled = isPurchased || product.quantidade <= 1;
          plusButton.disabled = isPurchased || product.quantidade >= 99;
        }

        minusButton.addEventListener("click", event => {
          event.stopPropagation();
          product.quantidade = Math.max(1, product.quantidade - 1);
          saveQuantities();
          refreshQuantity();
          updateTotal();
        });

        plusButton.addEventListener("click", event => {
          event.stopPropagation();
          product.quantidade = Math.min(99, product.quantidade + 1);
          saveQuantities();
          refreshQuantity();
          updateTotal();
        });

        function openProductDetail() {
          try {
            localStorage.setItem(detailStorageKey, JSON.stringify({
              ...product,
              quantidadeSugerida: product.quantidadeSugerida || "A definir"
            }));
          } catch {
            /* A navegação ainda funciona; a página de detalhe exibirá uma orientação. */
          }
          window.location.href = "produto.html";
        }

        card.addEventListener("click", event => {
          if (event.target.closest("button, input")) return;
          openProductDetail();
        });

        card.addEventListener("keydown", event => {
          if ((event.key === "Enter" || event.key === " ") && !event.target.closest("button, input")) {
            event.preventDefault();
            openProductDetail();
          }
        });

        refreshQuantity();
        card.append(checkbox, image, info, isPurchased ? returnButton : quantityControl);
          categoryItems.append(card);
        });

        section.append(heading, categoryItems);
        listElement.append(section);
      });
    }

    purchasedViewButton.addEventListener("click", () => {
      currentView = currentView === "shopping" ? "purchased" : "shopping";
      activeMarket = "Todos";
      renderFilters();
      renderList();
      updateViewControls();
    });

    selectAllButton.addEventListener("click", () => {
      getSelectableIndexes().forEach(index => selectedItems.add(index));
      renderList();
      updateTotal();
    });

    clearButton.addEventListener("click", () => {
      selectedItems.clear();
      document.querySelectorAll(".checkbox").forEach(input => { input.checked = false; });
      document.querySelectorAll(".item.selected").forEach(item => item.classList.remove("selected"));
      updateTotal();
    });

    checkoutButton.addEventListener("click", () => {
      selectedItems.forEach(index => purchasedItems.add(productKey(produtos[index])));
      savePurchasedItems();
      selectedItems.clear();
      renderList();
      updateTotal();
      updateViewControls();
    });

    renderFilters();
    renderList();
    updateTotal();
    updateViewControls();
  </script>
</body>
</html>
